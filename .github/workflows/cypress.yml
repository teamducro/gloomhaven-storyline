name: Cypress tests

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.split.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
      - id: split
        run: |
          # ponytail: balances on line count, swap for recorded spec durations if groups drift apart
          specs=$(wc -l cypress/e2e/tracker/*.cy.js | grep -v ' total$' | sort -rn | jq -Rn '
            reduce (inputs | capture("(?<lines>\\d+) (?<file>.+)")) as $s ([range(4) | {lines: 0, files: []}];
              (to_entries | min_by(.value.lines).key) as $i
              | .[$i].lines += ($s.lines | tonumber) | .[$i].files += [$s.file])
            | map(.files | join(",")) | tojson' -r)
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        specs: ${{ fromJson(needs.prepare.outputs.specs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Cypress binary is installed
        run: npx cypress install

      - name: Set up .env
        run: cp .github/.env .env

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          build: npm run production
          start: npx http-server public -p 8080 --silent
          wait-on: 'http://localhost:8080'
          command: npx cypress run --config baseUrl=http://localhost:8080 --spec ${{ matrix.specs }}
