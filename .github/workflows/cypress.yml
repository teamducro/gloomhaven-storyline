name: Cypress tests

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Cypress binary is installed
        run: npx cypress install

      - name: Set up .env
        run: cp .github/.env .env

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          build: npm run production
          start: npx http-server public -p 8080 --silent
          wait-on: 'http://localhost:8080'
          command: npm run test:ci -- --config baseUrl=http://localhost:8080
