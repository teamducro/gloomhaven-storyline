name: Cypress tests

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Set up .env
        run: cp .env.example .env

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          build: npm run production
          start: npx http-server public -p 8080 --silent
          wait-on: 'http://localhost:8080'
          command: npm run test:ci -- --config baseUrl=http://localhost:8080
